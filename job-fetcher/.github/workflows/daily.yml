name: Daily Job Digest

# Runs once a day and on manual trigger. GitHub cron is UTC: 13:00 UTC ≈ 8am
# US Central / 9am US Eastern. Adjust the cron below for your timezone.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Needed so the workflow can commit the new digest / CSV / DB back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily pipeline
        env:
          # Required for Claude classify/rank. Without it the run still
          # fetches/filters/stores but produces an empty digest.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional aggregators — self-skip if unset.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          # Optional email delivery — self-skip if unset.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python run.py

      - name: Commit digest, CSV, and dedupe DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ matches.csv jobs.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily digest $(date -u +%Y-%m-%d)"
            git push
          fi
